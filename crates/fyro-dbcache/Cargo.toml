[package]
name = "fyro-dbcache"
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
description = "FyroDB database caching proxy engine with cross-protocol storage sharing"

[lib]
name = "fyro_dbcache"
path = "src/lib.rs"

[features]
# Enables Unix domain socket support for the proxy: clients may connect via
# <dir>/.s.PGSQL.<port> and upstream targets may use host=/dir or a
# percent-encoded URI host. Only meaningful on unix platforms.
unix-sockets = ["fyro-net/unix-sockets"]

[dependencies]
fyro-net = { path = "../fyro-net" }
base64 = "0.23"
foldhash = "0.2.0"
getrandom = "0.4"
md-5 = "0.11"
native-tls = "0.2.18"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlparser = { version = "0.63.0", default-features = false, features = ["std", "visitor"] }
mio = { version = "1.2", features = ["net", "os-poll"] }
socket2 = { version = "0.6", features = ["all"] }
